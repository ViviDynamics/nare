name: Release

# Tags a release only after CI passes on main, so an unvalidated commit is never
# released. workflow_run also fires for fork PRs, which is why the job below
# accepts nothing but a successful push to this repository's main.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    name: Tag CalVer release
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.derive.outputs.version }}
    steps:
      - name: Checkout the validated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Fetch tags
        run: git fetch --tags --force

      # Derived from existing tags rather than a committed file, as in elm and
      # conductor: nothing on a branch can go stale or need bumping. A tag
      # already on the commit is reused so a rerun is idempotent.
      - name: Derive CalVer version from existing tags
        id: derive
        shell: bash
        run: |
          set -euo pipefail
          existing="$(git tag --points-at HEAD | grep -E '^v?[0-9]{4}\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' | head -n 1 || true)"
          if [ -n "$existing" ]; then
            echo "Reusing existing tag on HEAD: $existing"
            version="${existing#v}"
          else
            version="$(python3 .github/scripts/next_calver.py)"
            echo "Derived new version: $version"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release and tag
        uses: actions/github-script@v7
        env:
          VERSION: ${{ steps.derive.outputs.version }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        with:
          script: |
            const version = process.env.VERSION;
            const sha = process.env.SHA;

            try {
              await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: version,
              });
              console.log(`Release ${version} already exists, skipping`);
              return;
            } catch (e) {
              if (e.status !== 404) throw e;
            }

            const commit = await github.rest.repos.getCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: sha,
            });

            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: version,
              target_commitish: sha,
              name: version,
              body: commit.data.commit.message,
            });
            console.log(`Created release ${version}`);

  publish:
    name: Publish the wheel and the image
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      # The TAG, not the branch head: what ships must be the commit that was
      # validated and released, even if main has moved since.
      - name: Checkout the released tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.version }}
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      # hatch-vcs reads the tag, so the wheel's metadata is the release version
      # by construction rather than by a value somebody remembered to bump.
      - name: Build the wheel and the sdist
        run: uv build

      - name: Check the built version is the released one
        shell: bash
        run: |
          set -euo pipefail
          version='${{ needs.release.outputs.version }}'
          ls "dist/nare-${version}-py3-none-any.whl" "dist/nare-${version}.tar.gz"

      - name: Attach both to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload '${{ needs.release.outputs.version }}' dist/* --clobber

      - name: Log in to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push the image
        shell: bash
        run: |
          set -euo pipefail
          version='${{ needs.release.outputs.version }}'
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/nare"
          docker build \
            --build-arg "WHEEL=dist/nare-${version}-py3-none-any.whl" \
            -t "${image}:${version}" -t "${image}:latest" .
          docker push "${image}:${version}"
          docker push "${image}:latest"

      - name: Check the image reports the released version
        shell: bash
        run: |
          set -euo pipefail
          version='${{ needs.release.outputs.version }}'
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/nare"
          printed="$(docker run --rm "${image}:${version}" --version)"
          if [ "$printed" != "$version" ]; then
            echo "image reports ${printed}, release is ${version}" >&2
            exit 1
          fi
