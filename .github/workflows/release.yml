name: Release

# Tags a release only after CI passes on main, so an unvalidated commit is never
# released. workflow_run also fires for fork PRs, which is why the job below
# accepts nothing but a successful push to this repository's main.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    name: Tag CalVer release
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.derive.outputs.version }}
    steps:
      - name: Checkout the validated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Fetch tags
        run: git fetch --tags --force

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      # Derived from existing tags rather than a committed file, as in elm and
      # conductor: nothing on a branch can go stale or need bumping. A tag
      # already on the commit is reused so a rerun is idempotent.
      - name: Derive CalVer version from existing tags
        id: derive
        shell: bash
        run: |
          set -euo pipefail
          existing="$(git tag --points-at HEAD | grep -E '^v?[0-9]{4}\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' | head -n 1 || true)"
          if [ -n "$existing" ]; then
            echo "Reusing existing tag on HEAD: $existing"
            version="${existing#v}"
          else
            version="$(python3 .github/scripts/next_calver.py)"
            echo "Derived new version: $version"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # A rerun of a published release exists to retry the image push. The
      # steps that make a release are skipped for it, so their network calls
      # cannot fail the job the image waits on.
      - name: Check whether this release is already published
        id: existing
        shell: bash
        env:
          VERSION: ${{ steps.derive.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          err="${RUNNER_TEMP}/release-lookup.txt"
          if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${VERSION}" --silent 2>"$err"; then
            echo "Release ${VERSION} already exists; skipping the build and publish steps"
            echo "published=true" >> "$GITHUB_OUTPUT"
          elif grep -q "HTTP 404" "$err"; then
            echo "published=false" >> "$GITHUB_OUTPUT"
          else
            cat "$err" >&2
            exit 1
          fi

      # Tagged locally first: hatch-vcs reads `git describe`, so the wheel can
      # only carry the release version if the tag exists before the build.
      - name: Tag locally, then build the wheel and the sdist
        if: steps.existing.outputs.published != 'true'
        shell: bash
        run: |
          set -euo pipefail
          version='${{ steps.derive.outputs.version }}'
          git tag --force "$version"
          uv build
          ls "dist/nare-${version}-py3-none-any.whl" "dist/nare-${version}.tar.gz"

      # Bound to this tag and this wheel's SHA-256, so the stable
      # releases/latest/download/install.sh URL always installs the wheel of
      # the release it came from.
      - name: Render the installer for this release
        if: steps.existing.outputs.published != 'true'
        run: python3 .github/scripts/release_assets.py render '${{ steps.derive.outputs.version }}'

      # The bytes about to be published, installed the way a reader will: a
      # clean install, then a repeat. A broken installer stops the release
      # here, because an immutable release cannot be fixed afterwards.
      - name: Install from the release assets, clean and again
        if: steps.existing.outputs.published != 'true'
        run: .github/scripts/smoke_installer.sh dist '${{ steps.derive.outputs.version }}'

      - name: Create GitHub release and tag
        if: steps.existing.outputs.published != 'true'
        uses: actions/github-script@v7
        env:
          VERSION: ${{ steps.derive.outputs.version }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          GITHUB_TOKEN: ${{ github.token }}
        with:
          script: |
            const version = process.env.VERSION;
            const sha = process.env.SHA;

            try {
              await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: version,
              });
              console.log(`Release ${version} already exists, skipping`);
              return;
            } catch (e) {
              if (e.status !== 404) throw e;
            }

            const commit = await github.rest.repos.getCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: sha,
            });

            // The assets go on in the SAME call that creates the release.
            // This repository's releases are immutable, so `gh release upload`
            // afterwards fails with HTTP 422 and a release ships bare.
            const { execFileSync } = require('node:child_process');
            // Exactly the wheel, the sdist and install.sh. The check fails on
            // anything else in dist/ except `uv build`'s own .gitignore, which
            // 2026.9.7 shipped as an asset called default.gitignore.
            const report = JSON.parse(execFileSync('python3', [
              '.github/scripts/release_assets.py', 'check', version,
            ], { encoding: 'utf8' }));
            const files = report.files;
            // The hashes go in the notes, so a caller can pin the bytes as well
            // as the version. The assets never change after this call.
            const install = `curl -fsSL https://github.com/${context.repo.owner}/${context.repo.repo}/releases/download/${version}/install.sh | sh`;
            const notes = `${commit.data.commit.message}\n\nInstall this release with its terminal UI:\n\n    ${install}\n\nSHA-256:\n\n${report.sha256_notes}`;
            execFileSync('gh', [
              'release', 'create', version,
              '--target', sha,
              '--title', version,
              '--notes', notes,
              ...files,
            ], { stdio: 'inherit', env: { ...process.env, GH_TOKEN: process.env.GITHUB_TOKEN } });
            console.log(`Created release ${version} with ${files.length} asset(s)`);

  image:
    name: Publish the container image
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # The TAG, not the branch head: what ships must be the commit that was
      # validated and released, even if main has moved since.
      - name: Checkout the released tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.version }}
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      # hatch-vcs reads the tag, so the wheel's metadata is the release version
      # by construction rather than by a value somebody remembered to bump.
      - name: Build the wheel and the sdist
        run: uv build

      - name: Check the built version is the released one
        shell: bash
        run: |
          set -euo pipefail
          version='${{ needs.release.outputs.version }}'
          ls "dist/nare-${version}-py3-none-any.whl" "dist/nare-${version}.tar.gz"

      - name: Set up QEMU for the arm64 half
        uses: docker/setup-qemu-action@v3

      - name: Set up buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push the image
        shell: bash
        run: |
          set -euo pipefail
          version='${{ needs.release.outputs.version }}'
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/nare"
          # A version's image is pushed once (docs/contract.md, Releases). A
          # rerun rebuilds different bytes, so it leaves a published one, and
          # latest, as they are.
          if docker buildx imagetools inspect "${image}:${version}" >/dev/null 2>&1; then
            echo "${image}:${version} is already published; leaving it"
            exit 0
          fi
          # Both architectures in one manifest: the runners are amd64 and the
          # machines that pull this are arm64, and a single-arch image makes
          # every local run go through emulation.
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --build-arg "WHEEL=dist/nare-${version}-py3-none-any.whl" \
            -t "${image}:${version}" -t "${image}:latest" \
            --push .

      - name: Check the image reports the released version
        shell: bash
        run: |
          set -euo pipefail
          version='${{ needs.release.outputs.version }}'
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/nare"
          # Pulls the manifest and runs the runner's own architecture.
          printed="$(docker run --rm "${image}:${version}" --version)"
          if [ "$printed" != "$version" ]; then
            echo "image reports ${printed}, release is ${version}" >&2
            exit 1
          fi
