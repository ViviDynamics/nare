name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: lint, types, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync
      # The bash sandbox tests run the real bubblewrap here, and must not skip:
      # NARE_REQUIRE_SANDBOX turns a missing sandbox into a failure. Ubuntu's
      # AppArmor policy can block the unprivileged user namespaces bwrap needs,
      # so lift that restriction first where the kernel has it.
      - name: Install bubblewrap for the bash sandbox tests
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - name: Allow unprivileged user namespaces for bubblewrap
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - run: bin/build
        env:
          NARE_REQUIRE_SANDBOX: "1"

  sandbox-macos:
    # The Seatbelt profile has no other CI coverage. NARE_REQUIRE_SANDBOX makes a
    # missing sandbox fail the job rather than skip the escape tests.
    name: bash sandbox (macOS Seatbelt)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync
      - run: uv run pytest -q tests/test_sandbox.py tests/test_sandbox_live.py
        env:
          NARE_REQUIRE_SANDBOX: "1"

  installer:
    # The release's install.sh, built, rendered and installed exactly as the
    # release job does it, so a broken installer fails a pull request rather
    # than a release. Linux and macOS are the systems it supports.
    name: installer smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      # The next CalVer is tagged locally and never pushed, so the wheel and
      # the installer carry a release-shaped version, as they do on main.
      - name: Build a release-shaped wheel and render its installer
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force
          version="$(python3 .github/scripts/next_calver.py)"
          git tag --force "$version"
          uv build
          python3 .github/scripts/release_assets.py render "$version"
          python3 .github/scripts/release_assets.py check "$version" >/dev/null
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Install from those assets, clean and again
        run: .github/scripts/smoke_installer.sh dist "$VERSION"

  cases:
    name: benchmark cases measure something
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync
      # Needs Docker, but no API key and no money: it only proves that each
      # case's checks fail before an agent touches the fixture.
      # --tier full is every case: verify is free, so nothing goes unchecked.
      - run: bin/bench verify --tier full
      # The extended tier is not part of full. verify applies each extended
      # case's reference solution and exploit, so drift in those is caught
      # here. Still no model calls and no key.
      - run: bin/bench verify --tier extended
