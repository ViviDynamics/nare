name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: lint, types, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync
      - run: bin/build

  cases:
    name: benchmark cases measure something
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync
      # Needs Docker, but no API key and no money: it only proves that each
      # case's checks fail before an agent touches the fixture.
      # --tier full is every case: verify is free, so nothing goes unchecked.
      - run: bin/bench verify --tier full
      # The extended tier is not part of full. verify applies each extended
      # case's reference solution and exploit, so drift in those is caught
      # here. Still no model calls and no key.
      - run: bin/bench verify --tier extended
