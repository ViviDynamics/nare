name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: lint, types, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync
      # The bash sandbox tests run the real bubblewrap here, and must not skip:
      # NARE_REQUIRE_SANDBOX turns a missing sandbox into a failure. Ubuntu's
      # AppArmor policy can block the unprivileged user namespaces bwrap needs,
      # so lift that restriction first where the kernel has it.
      - name: Install bubblewrap for the bash sandbox tests
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - name: Allow unprivileged user namespaces for bubblewrap
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - run: bin/build
        env:
          NARE_REQUIRE_SANDBOX: "1"

  sandbox-macos:
    # The Seatbelt profile has no other CI coverage. NARE_REQUIRE_SANDBOX makes a
    # missing sandbox fail the job rather than skip the escape tests.
    name: bash sandbox (macOS Seatbelt)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync
      - run: uv run pytest -q tests/test_sandbox.py tests/test_sandbox_live.py
        env:
          NARE_REQUIRE_SANDBOX: "1"

  cases:
    name: benchmark cases measure something
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync
      # Needs Docker, but no API key and no money: it only proves that each
      # case's checks fail before an agent touches the fixture.
      # --tier full is every case: verify is free, so nothing goes unchecked.
      - run: bin/bench verify --tier full
