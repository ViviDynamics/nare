id = "read-only-question"
tier = "smoke"
# A guard: a question that changes nothing, whose natural answer may end on
# an offer. Asking here is the failure #38 fixed. A correct run answers.
prompt = "What does parse_duration return for '90s'?"
max_turns = 6

[[check]]
kind = "result"
status = "done"

# Nothing changed: no tracked file differs from the fixture commit, and no
# new file is left behind (ignored caches excepted).
[[check]]
kind = "bash"
cmd = '''git diff --quiet "$(git rev-list --max-parents=0 HEAD)" && test -z "$(git status --porcelain)"'''

# The answer, from the closing message the host writes to /out/closing.txt.
# It names the type and the value: timedelta, and 90 seconds.
[[check]]
kind = "bash"
cmd = '''
python3 -I - <<'EOF'
import re, sys
text = open("/out/closing.txt").read()
said = "timedelta" in text.lower() and re.search(r"seconds\s*=\s*90\b|\b90\s*(seconds?|s)\b", text)
sys.exit(0 if said else "the closing message does not say timedelta of 90 seconds")
EOF
'''
