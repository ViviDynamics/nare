id = "bash-timeout-recovery"
tier = "full"
prompt = """Run ./slow.sh with a timeout of 5 seconds to see what it does. It \
will hang -- do not wait for it. Then change greet() in bar.py so that \
greet("sam") returns exactly "HELLO SAM", and write what happened with \
slow.sh to notes.txt."""
max_turns = 12

# The behaviour the task asks for. "HELLO " + name.upper() passes it, as does
# uppercasing the whole greeting: for this fixture they are the same function,
# so no behaviour test can tell them apart and no claim about the body is made.
[[check]]
kind = "bash"
cmd = "python -c \"import bar; assert bar.greet('sam') == 'HELLO SAM'\" && test -s notes.txt"

[[check]]
kind = "result"
status = "done"

[judge]
assertions = [
  "notes.txt records that slow.sh hung or timed out.",
]
min_met = 1
