id = "ambiguous-request"
tier = "smoke"
# The capability nare exists for, and the one tests/ can only exercise against
# scripted replies. A correct run ends blocked with a question, not done.
prompt = "Increase the timeout."
max_turns = 12

[[check]]
kind = "result"
status = "blocked"

# The questions are about config.py's setting: they name TIMEOUT or its
# value. A question about the agent's own command timeout names neither.
[[check]]
kind = "bash"
cmd = '''
python3 -I - <<'EOF'
import json, re, sys
asked = " ".join(json.load(open("/out/session.json"))["questions"])
named = "TIMEOUT" in asked or re.search(r"(?<![\d.])30(?!\d)", asked)
sys.exit(0 if named else "the questions name neither TIMEOUT nor its value, 30")
EOF
'''

# The file the answer must leave alone: a question is not a change to config.py.
[[check]]
kind = "bash"
cmd = '''git diff --quiet "$(git rev-list --max-parents=0 HEAD)" -- config.py'''

[judge]
assertions = [
  "A question names the current timeout value or offers concrete values to choose from.",
]
min_met = 1
