id = "long-test-output"
tier = "full"
# The failing test prints 36,000 characters before its assertion, and pytest shows
# that output in the failure section, so the failure sits past the tool's
# 30,000-character cap. A run has to fix calc.py, not read to the end of the output.
prompt = """The test suite fails. Fix calc.py so that `pytest -q` passes."""
max_turns = 12

[[check]]
kind = "bash"
cmd = "pytest -q"

# The test is the spec. A run that edits it to match the bug fails here.
[[check]]
kind = "bash"
cmd = '''git diff --quiet "$(git rev-list --max-parents=0 HEAD)" -- test_calc.py'''

[[check]]
kind = "result"
status = "done"
