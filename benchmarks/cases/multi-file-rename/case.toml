id = "multi-file-rename"
tier = "smoke"
prompt = """Rename the function calc_area to rectangle_area everywhere it \
appears, and make sure the test suite still passes."""
max_turns = 15

[[check]]
kind = "bash"
cmd = "! rg -q 'calc_area' . && rg -q 'rectangle_area' shape.py && pytest -q"

# No file deleted and no test removed. The fixture has two tests, in
# test_report.py; a test moved to a new file still counts.
[[check]]
kind = "bash"
cmd = '''test -z "$(git diff --name-only --diff-filter=D "$(git rev-list --max-parents=0 HEAD)")" && test "$(grep -rho 'def test_' --include='*.py' . | wc -l)" -ge 2'''

[[check]]
kind = "result"
status = "done"
