id = "report-refactor"
tier = "extended"
# A refactor that must keep behaviour. The existing tests are coarse on purpose:
# they would pass a report that drifted in its ordering or rounding. The check
# that matters compares the new render_report with the original, read from the
# fixture commit, over hundreds of seeded inputs, ties and rounding included.
prompt = """render_report in inventory/report.py is one long function: it parses the items, groups them by warehouse, and formats the table. Split it so that parsing, grouping and table formatting each live in their own function, in their own module under inventory/ (for example parse.py, group.py and table.py), with render_report left in inventory/report.py as the entry point. render_report must return exactly the same text as before for every input, including the order of rows that tie and the rounding. The existing tests in tests/ must pass without changes. You may add new test files."""
max_turns = 30

[[check]]
kind = "result"
status = "done"

[[check]]
kind = "bash"
cmd = "python -m pytest -q"

# The existing test file is the same as the fixture's. New tests are welcome,
# but the old ones are the contract the refactor is held to.
[[check]]
kind = "bash"
cmd = 'test -z "$(git diff --name-only "$(git rev-list --max-parents=0 HEAD)" -- tests/test_report.py)"'

# The split happened: more than the package and the one function's module.
[[check]]
kind = "bash"
cmd = 'test "$(ls inventory/*.py | wc -l)" -ge 4'

# The original render_report, read from the fixture commit, against the new
# one, on seeded inputs. Ties, rounding, truncation and bad sort keys included.
[[check]]
kind = "bash"
cmd = '''
python3 -I - <<'PYEOF'
import os, random, subprocess, sys
sys.path.insert(0, os.getcwd())
root = subprocess.run(["git", "rev-list", "--max-parents=0", "HEAD"], capture_output=True, text=True, check=True).stdout.split()[0]
source = subprocess.run(["git", "show", root + ":inventory/report.py"], capture_output=True, text=True, check=True).stdout
namespace = {}
exec(compile(source, "original_report.py", "exec"), namespace)
original = namespace["render_report"]
from inventory.report import render_report as refactored

rng = random.Random(7)
skus = ["a-1", "B-2", "c-3", "a-1", "d-4 ", " e-5", "f-6"]
names = ["bolt", "anchor chain heavy duty", "  washer  ", "", "x" * 25]
warehouses = ["north", "south", "", " east ", "Zed"]
costs = ["0.25", "4.00", "2.50", "1.005", "19.999", "0"]

def outcome(fn, items, **kwargs):
    try:
        return ("ok", fn(items, **kwargs))
    except Exception as err:
        return ("error", type(err).__name__, str(err))

bad = []
for case in range(600):
    items = [
        {"sku": rng.choice(skus), "name": rng.choice(names), "warehouse": rng.choice(warehouses),
         "qty": rng.choice([0, 1, 3, 10, 250]), "unit_cost": rng.choice(costs)}
        for _ in range(rng.randint(0, 12))
    ]
    kwargs = {"sort_by": rng.choice(["sku", "value", "sku", "value", "colour"]),
              "show_empty": rng.choice([True, False])}
    if outcome(original, items, **kwargs) != outcome(refactored, items, **kwargs):
        bad.append(case)
if bad:
    print("%d of 600 inputs render differently; first case %d" % (len(bad), bad[0]))
    sys.exit(1)
PYEOF
'''

[judge]
assertions = [
  "The diff moves parsing, grouping and table formatting each into its own function, in its own module under inventory/.",
  "The diff keeps render_report in inventory/report.py, with the same signature.",
  "The diff does not change any test that was already in tests/test_report.py.",
]
min_met = 3
