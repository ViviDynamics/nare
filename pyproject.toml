[build-system]
requires = ["hatchling>=1.27", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[project]
name = "nare"
dynamic = ["version"]
description = "A standalone agent harness: a loop, a tool set, a transport layer, and a serializable session."
readme = "README.md"
requires-python = ">=3.12"
license = "LicenseRef-Elastic-License-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = ["anthropic>=1.6"]

[project.scripts]
nare = "nare.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6", "mypy>=1.11"]

# The version comes from the git tag the release workflow minted, so a wheel's
# metadata cannot drift from the release it was built at. A caller pins that
# number and reads the same one back off the session.
[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/nare/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/nare"]

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "tests"
# Case fixtures are sample code for the agent to edit, not runner code: they
# are deliberately untyped, and several of them are named bar.py.
exclude = ["^benchmarks/cases/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "benchmarks/tests"]
markers = [
  "live: hits the real Anthropic API; needs ANTHROPIC_API_KEY",
  "docker: needs a working docker daemon",
]
addopts = "-m 'not live and not docker'"
