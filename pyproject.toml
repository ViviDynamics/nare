[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "nare"
version = "0.1.0"
description = "A standalone agent harness: a loop, a tool set, a transport layer, and a serializable session."
readme = "README.md"
requires-python = ">=3.12"
license = "LicenseRef-Elastic-License-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = ["anthropic>=1.6"]

[project.scripts]
nare = "nare.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6", "mypy>=1.11"]

[tool.hatch.build.targets.wheel]
packages = ["src/nare"]

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "tests"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["live: hits the real Anthropic API; needs ANTHROPIC_API_KEY"]
addopts = "-m 'not live'"
